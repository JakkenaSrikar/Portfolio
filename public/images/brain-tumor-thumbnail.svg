<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="grad-cam-heat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bg-grad)" />
  
  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Headers -->
  <text x="50" y="80" fill="#94a3b8" font-family="monospace" font-size="16" letter-spacing="2" font-weight="bold">MEDICAL IMAGING &amp; COMPUTER VISION</text>
  <text x="50" y="130" fill="#ffffff" font-family="sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">Brain Tumor Detection</text>
  
  <!-- Graphic (Brain MRI & Segmentation Overlay) -->
  <g transform="translate(450, 100)">
    <!-- Brain Silhouette Outer Structure -->
    <path d="M 120,20 C 50,20 20,60 20,120 C 20,170 50,200 90,210 C 100,212 110,215 120,215 C 130,215 140,212 150,210 C 190,200 220,170 220,120 C 220,60 190,20 120,20 Z" 
          fill="#1e293b" fill-opacity="0.3" stroke="#475569" stroke-width="3" />
          
    <!-- Ventricles / Brain Details -->
    <path d="M 90,80 C 80,90 80,110 90,120 C 95,125 105,125 110,120" stroke="#334155" stroke-width="2" fill="none" />
    <path d="M 150,80 C 160,90 160,110 150,120 C 145,125 135,125 130,120" stroke="#334155" stroke-width="2" fill="none" />
    
    <!-- Grad-CAM Highlight (Explainable AI Heatmap) -->
    <circle cx="150" cy="140" r="45" fill="url(#grad-cam-heat)" />
    
    <!-- Segmentation Mask Boundary (U-Net Output) -->
    <path d="M 120,125 C 130,115 160,115 170,125 C 180,135 180,155 170,165 C 160,175 130,175 120,165 C 110,155 110,135 120,125 Z" 
          stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4 2" fill="#ef4444" fill-opacity="0.15" />
          
    <!-- Segmentation Label -->
    <line x1="170" y1="145" x2="240" y2="175" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="170" cy="145" r="3" fill="#ef4444" />
    <text x="248" y="179" fill="#ef4444" font-family="monospace" font-size="11" font-weight="bold">TUMOR MASK</text>
    
    <!-- Grad-CAM Text Label -->
    <line x1="140" y1="135" x2="60" y2="60" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="140" cy="135" r="3" fill="#f59e0b" />
    <text x="-25" y="55" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">GRAD-CAM ACTIVATION</text>
  </g>

  <!-- Metric Badge -->
  <g transform="translate(50, 350)">
    <rect x="0" y="0" width="240" height="45" rx="10" fill="rgba(16, 185, 129, 0.1)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="15" y="27" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="bold">96% Classification Accuracy</text>
  </g>
</svg>
