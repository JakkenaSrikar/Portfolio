<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bg-grad)" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Title Text Overlay -->
  <text x="50" y="80" fill="#94a3b8" font-family="monospace" font-size="16" letter-spacing="2" font-weight="bold">COMPUTER VISION &amp; DEEP LEARNING</text>
  <text x="50" y="130" fill="#ffffff" font-family="sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">SignBridge AI</text>
  
  <!-- Visual Illustration (Hand Gesture & Speech) -->
  <g transform="translate(420, 100)">
    <!-- Glow Effect -->
    <circle cx="150" cy="120" r="100" fill="#3b82f6" fill-opacity="0.1" filter="blur(20px)" />
    
    <!-- Gesture Recognition Node Net -->
    <path d="M 50,200 L 90,140 L 110,80 L 100,40 M 90,140 L 140,80 L 135,30 M 90,140 L 175,90 L 170,40 M 90,140 L 205,110 L 200,60 M 90,140 L 230,150 L 225,110" 
          stroke="url(#accent-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
          
    <!-- Node Joints -->
    <circle cx="50" cy="200" r="6" fill="#3b82f6" />
    <circle cx="90" cy="140" r="6" fill="#3b82f6" />
    <circle cx="110" cy="80" r="5" fill="#3b82f6" />
    <circle cx="100" cy="40" r="5" fill="#06b6d4" />
    <circle cx="140" cy="80" r="5" fill="#3b82f6" />
    <circle cx="135" cy="30" r="5" fill="#06b6d4" />
    <circle cx="175" cy="90" r="5" fill="#3b82f6" />
    <circle cx="170" cy="40" r="5" fill="#06b6d4" />
    <circle cx="205" cy="110" r="5" fill="#3b82f6" />
    <circle cx="200" cy="60" r="5" fill="#06b6d4" />
    <circle cx="230" cy="150" r="5" fill="#3b82f6" />
    <circle cx="225" cy="110" r="5" fill="#06b6d4" />
    
    <!-- Camera Frame Overlay -->
    <rect x="0" y="0" width="300" height="220" rx="12" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" />
    <text x="20" y="30" fill="#06b6d4" font-family="monospace" font-size="12" font-weight="bold">WEBCAM: LIVE</text>
    <circle cx="280" cy="25" r="4" fill="#ef4444" />
  </g>
  
  <!-- Dynamic Metrics Tag -->
  <g transform="translate(50, 350)">
    <rect x="0" y="0" width="220" height="45" rx="10" fill="rgba(59, 130, 246, 0.15)" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="15" y="27" fill="#3b82f6" font-family="sans-serif" font-size="14" font-weight="bold">92% Recognition Accuracy</text>
  </g>
</svg>
