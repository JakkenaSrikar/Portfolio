<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="db-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bg-grad)" />
  
  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Headers -->
  <text x="50" y="80" fill="#94a3b8" font-family="monospace" font-size="16" letter-spacing="2" font-weight="bold">GENERATIVE AI &amp; NATURAL LANGUAGE PROCESSING</text>
  <text x="50" y="130" fill="#ffffff" font-family="sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">RAG Document Q&amp;A</text>
  
  <!-- Visual Diagram (Ingestion & QA Flow) -->
  <g transform="translate(420, 110)">
    <!-- PDF Document Card -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="70" height="90" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2" />
      <line x1="15" y1="25" x2="55" y2="25" stroke="#94a3b8" stroke-width="2" />
      <line x1="15" y1="40" x2="55" y2="40" stroke="#94a3b8" stroke-width="2" />
      <line x1="15" y1="55" x2="40" y2="55" stroke="#94a3b8" stroke-width="2" />
      <rect x="15" y="70" width="20" height="10" rx="2" fill="#ef4444" />
      <text x="18" y="78" fill="#ffffff" font-family="sans-serif" font-size="7" font-weight="bold">PDF</text>
    </g>
    
    <!-- Flow Arrow 1 -->
    <path d="M 80,75 L 120,75" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arrow)" />
    
    <!-- Chroma Vector Database Cylinders -->
    <g transform="translate(135, 15)">
      <!-- Base Cylinder -->
      <ellipse cx="40" cy="90" rx="35" ry="12" fill="url(#db-grad)" stroke="#059669" stroke-width="1.5" />
      <rect x="5" y="55" width="70" height="35" fill="url(#db-grad)" stroke="#059669" stroke-width="1.5" stroke-dasharray="0 70 0" />
      
      <!-- Middle Cylinder -->
      <ellipse cx="40" cy="55" rx="35" ry="12" fill="url(#db-grad)" stroke="#059669" stroke-width="1.5" />
      <rect x="5" y="20" width="70" height="35" fill="url(#db-grad)" stroke="#059669" stroke-width="1.5" stroke-dasharray="0 70 0" />
      
      <!-- Top Cylinder -->
      <ellipse cx="40" cy="20" rx="35" ry="12" fill="#34d399" stroke="#059669" stroke-width="1.5" />
      
      <text x="18" y="60" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">CHROMA</text>
      <text x="24" y="72" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">DB</text>
    </g>
    
    <!-- Flow Arrow 2 -->
    <path d="M 220,75 L 260,75" stroke="#10b981" stroke-width="3" stroke-linecap="round" fill="none" />
    
    <!-- User Query & LLM Output Box -->
    <g transform="translate(275, 25)">
      <rect x="0" y="0" width="100" height="100" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2" />
      <circle cx="50" cy="35" r="15" fill="#10b981" fill-opacity="0.1" />
      <path d="M 45,35 Q 50,30 55,35 Q 50,40 45,35 Z" stroke="#10b981" stroke-width="1.5" fill="none" />
      <text x="15" y="75" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" cx="50">LLM ANSWER</text>
      <path d="M 25,70 L 75,70" stroke="#334155" stroke-width="1" />
      <text x="50" y="87" fill="#10b981" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">GROUNDED</text>
    </g>
  </g>

  <!-- Metric Badge -->
  <g transform="translate(50, 350)">
    <rect x="0" y="0" width="220" height="45" rx="10" fill="rgba(16, 185, 129, 0.1)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
    <text x="15" y="27" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="bold">Context-Grounded QA</text>
  </g>
</svg>
